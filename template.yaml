AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Loan Payment Batch Validation - S3 upload triggers Lambda, which
  validates the CSV and stores results in PostgreSQL (RDS).
  This is a template for your own AWS account; deploy it yourself,
  with your own bucket/database names, and never commit real
  credentials. See README.md "Deploying to AWS" for the steps.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256

Resources:
  InputBucket:
    Type: AWS::S3::Bucket

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      # Use a Secrets Manager secret in a real deployment instead of
      # a plain parameter, and put the DB in private subnets.

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: loan_batch.lambda_handler.handler
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgresql+psycopg2://${DBUsername}:${DBPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/loan_batches"
      Policies:
        # Least privilege for this function: read only from the input
        # bucket, plus CloudWatch Logs. No S3 write, no IAM, no other
        # services. Replace the bucket policy with the real bucket ARN.
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        - CloudWatchPutMetricPolicy: {}
      Events:
        OnUpload:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*

  FailedBatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alert when the validation Lambda reports errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ValidateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

Parameters:
  DBUsername:
    Type: String
  DBPassword:
    Type: String
    NoEcho: true
